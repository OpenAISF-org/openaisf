# openaisf.org — static, no build step, no external requests.
#
# The policy below is part of the argument. A standard about verifiable claims
# should not ask you to trust that its own page behaves: default-src 'none'
# denies everything, the two inline scripts are pinned by SHA-256 hash rather
# than allowed with 'unsafe-inline', and there is no analytics, no font CDN and
# no third-party anything to permit.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-I+w+Gj7bCqiSTMeiStAG31j4NmXLwNmYwp3jCktBzko=' 'sha256-XMWHZo8UKf/aVhgQ69yzYJfoq7wcN9vKRAyrJaRnsvY='; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[project]
name = "openaisf"
version = "1.0.0a2"
description = "OpenAISF — open AI safety and security conformance framework. Created by Maarten Loose."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
signing = ["cryptography>=42"]

[project.scripts]
openaisf = "openaisf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Copyright position: ISO/IEC 23894 is an ISO/IEC copyright document. No clause
# text is reproduced here — only clause identifiers, which are references, not
# content. Obtain the standard from ISO to read it. Clause identifiers are
# quoted throughout so YAML does not parse them as floating-point numbers.
#
# Position of this regime: ISO/IEC 23894:2023 is guidance, not certifiable
# requirements — it adapts the generic ISO 31000 risk-management process to AI
# systems. Its clauses are broad headings rather than auditable criteria, so
# every item is atomic: false and no mapping to it is ever full strength; a
# control can address part of a clause, never satisfy it wholly. Clauses 1–3
# (scope, normative references, terms) and the annexes carry no substantive
# obligation and are not inventoried. The clause enumeration follows the
# official NIST crosswalk (NIST AI RMF 1.0 to ISO/IEC 23894:2023, revised
# edition, airc.nist.gov) so that no memory or unlicensed reproduction is the
# source of the clause list.


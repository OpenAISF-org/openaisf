# MCP-38: A Comprehensive Threat Taxonomy for Model Context Protocol Systems (v1.0)
# Shen, Toyoda and Leung — arXiv:2603.18063.
# 38 empirically validated threats in five risk categories:
#   I   Semantic Manipulation & Poisoning
#   II  Prompt Injection & Boundary Breaking
#   III Identity, Trust & Supply Chain
#   IV  Access Control & Logic Drift
#   V   Data Exfiltration & Resource Abuse
# Threat identifiers and names only.
# OpenAISF — created by Maarten Loose. Specification licensed CC-BY-4.0.
regime: mcp_38
name: MCP-38 Threat Taxonomy for Model Context Protocol Systems
version: "1.0"
source: "https://arxiv.org/abs/2603.18063"
licence: "CC-BY-4.0"

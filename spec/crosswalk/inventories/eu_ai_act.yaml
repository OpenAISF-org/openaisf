# Regulation (EU) 2024/1689 (Artificial Intelligence Act) obligation inventory.
#
# Granularity policy: lettered sub-obligations are enumerated where the
# regulation itself splits a duty into discrete lettered items that are
# separately auditable (Art. 5(1), 9(2), 10(2), 14(4), 50, 53(1), 55(1)).
# Elsewhere the article or paragraph is the atomic unit. Recitals are not
# obligations and are not inventoried.
#
# Timeline note: Art. 50, the GPAI penalty regime and national market
# surveillance powers became applicable on 2 August 2026. Chapter III
# high-risk obligations were deferred to 2 December 2027 by the 2025 Digital
# Omnibus amendments.
#
# OpenAISF — created by Maarten Loose. Specification licensed CC-BY-4.0.

# Requirements deliberately not implemented as OpenAISF controls.
#
# Every entry needs a reason. An empty reason fails the load, and an exclusion
# contradicted by the runtime probe fails the conformance run under D19-C05.
#
# Exclusion is legitimate where a requirement is a screening obligation, an
# adversary behaviour outside the defender's control surface, or a general
# information security control already governed by an established regime. It is
# not legitimate as a way to make the coverage report green.
#
# OpenAISF — created by Maarten Loose. Specification licensed CC-BY-4.0.

csa_aicm:
  - ref: AIS-07
    reason: >
      General information security control that is not AI-specific. The
      AICM extends the Cloud Controls Matrix, so it necessarily restates a
      full cloud security baseline. OpenAISF does not duplicate that
      baseline: this control is satisfied through the organisation's
      existing information security regime (ISO/IEC 27001, SOC 2 or
      equivalent) and imported as inherited assurance under D17-C02.
      Restating it here would add bureaucracy without adding safety.

# OpenAISF catalog — D15 Detection, Attribution & Forensics
#
# The Detect stage of the rogue-agent control chain, and the domain where
# OpenAISF has the most original ground. An agent, unlike a process, declares
# intent before it acts. That makes a class of detection possible which has no
# equivalent in classical security, and which no existing control framework
# requires.
#
# Detection here is never satisfied by declaring a detector. It is satisfied by
# a detector that has demonstrably fired. See D16 for the drill obligations.
#
# OpenAISF — created by Maarten Loose. Specification licensed CC-BY-4.0.
domain: D15
name: Detection, Attribution & Forensics
controls:
  - id: D15-C01
    title: Divergence between an agent's declared plan and its actions is detected
    domain: D15
    level: core
    chain_stage: detect
    normative: >
      Where an agent produces a plan or stated intent before acting, the
      deployment MUST compare the actions actually taken against that plan and
      MUST raise a detection event when the actions fall outside it. The
      comparison MUST NOT be performed by the agent under evaluation.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [operate, observe]
    applies_when:
      system_class: [agentic]
      autonomy: [">= planning"]
    tiers:
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T3: P7D
        T4: PT24H
      predicate: |
        divergence_detector.enabled == true
        AND divergence_detector.evaluator != subject_agent
        AND detector.fired_on_drill == true
    evidence:
      - schema: openaisf.evidence.divergence_detector.v1
        plane: control
        fields: [enabled, evaluator, thresholds]
      - schema: openaisf.evidence.divergence_event.v1
        plane: data
        fields: [evaluated, diverged, drill_detections, window]
    failure_mode: >
      In the GTG-1002 operation the AI performed 80 to 90 percent of tactical
      work autonomously against roughly thirty targets while its operators
      maintained that they were a security firm conducting authorised testing.
      Every individual action was plausible for the stated task. What was not
      plausible was the relationship between the stated task and the actions
      taken as a whole, and nothing was comparing the two.
    rationale: >
      This is the detection that only agents make possible. A conventional
      process does not announce what it is about to do, so there is nothing to
      compare its behaviour against; an agent that plans does. Requiring the
      comparison to be made by something other than the agent is not pedantry —
      an agent asked to audit its own conformance is the model being asked to
      report on the model, which is exactly the failure mode D19 exists to stop.
    crosswalk:
      mcp_38: [MCP-35]

  - id: D15-C02
    title: Attempts to act outside the capability manifest are detected at the attempt
    domain: D15
    level: core
    chain_stage: detect
    normative: >
      Any attempt by an agent to invoke a tool, reach a destination, assume a
      credential or read a data source outside its signed capability manifest
      MUST raise a detection event at the point of attempt, whether or not the
      attempt succeeded.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [operate, observe]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T2: required
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        undeclared_attempts.recorded == true
        AND detection.at_attempt == true
    evidence:
      - schema: openaisf.evidence.manifest_monitor.v1
        plane: control
        fields: [enabled, alert_routing]
      - schema: openaisf.evidence.manifest_violation.v1
        plane: data
        fields: [attempts, blocked, alerted, window]
    failure_mode: >
      Detecting only successful violations means the first signal arrives after
      the boundary has already been crossed. A blocked attempt is the highest
      quality signal available in an agentic system, because a correctly
      operating agent produces none of them at all.
    rationale: >
      D07-C01 makes the denial happen; this control makes somebody find out.
      They are deliberately separate: a deployment can enforce default-deny while
      routing the denials nowhere, which is a real and common configuration and
      one that yields no detection capability whatsoever.
    crosswalk:
      iso_42001: [A.6.2.8]
      nist_ai_rmf: [MEASURE-2.4]
      eu_ai_act: ["Art.12(1)", "Art.26(5)"]
      csa_aicm: [LOG-03, LOG-05]
      mcp_38: [MCP-05]

  - id: D15-C03
    title: Agent proliferation and call velocity outside human-plausible bounds is detected
    domain: D15
    level: core
    chain_stage: detect
    normative: >
      The deployment MUST monitor the rate of agent identity creation and the
      rate of agent actions, and MUST raise a detection event when either
      exceeds a declared bound derived from observed legitimate operation.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [operate, observe]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T3: P7D
        T4: PT24H
      predicate: |
        velocity_bounds declared
        AND baseline.derived_from_observation == true
        AND detector.fired_on_drill == true
    evidence:
      - schema: openaisf.evidence.velocity_policy.v1
        plane: control
        fields: [identity_creation_bound, action_rate_bound, baseline_window]
      - schema: openaisf.evidence.velocity_event.v1
        plane: data
        fields: [peak_identity_rate, peak_action_rate, breaches, window]
    failure_mode: >
      The Hugging Face intrusion ran many thousands of individual actions across
      a swarm of short-lived sandboxes with self-migrating command and control.
      GTG-1002 operated at thousands of requests per second. Both signatures are
      trivially visible in aggregate and invisible in any single action.
    rationale: >
      Volume and proliferation are the two signals a machine-speed attacker
      cannot suppress, because they are the point of using machine speed at all.
      Deriving the bound from observed operation rather than a guessed constant
      is what keeps this from being either useless or unusably noisy.
    crosswalk:
      iso_42001:
        - {ref: A.6.2.6, strength: partial}
        - {ref: A.6.2.8, strength: partial}
      nist_ai_rmf:
        - {ref: MEASURE-2.4, strength: partial}
        - {ref: MANAGE-4.1, strength: partial}
      eu_ai_act:
        - {ref: Art.72, strength: partial}
      owasp_llm_2025: [LLM10]
      owasp_llm_2026: [LLM06]
      mitre_atlas: [AML.T0035]
      csa_aicm:
        - {ref: LOG-08, strength: partial}
        - {ref: IAM-02, strength: partial}
      mcp_38: [MCP-33]

  - id: D15-C04
    title: Anomalous egress from an agent context is detected
    domain: D15
    level: core
    chain_stage: detect
    normative: >
      Egress attempts to destinations outside the declared allowlist MUST raise
      a detection event recording the destination. Detection MUST cover
      destinations that are themselves reputable public services.
    rfc2119: MUST
    roles: [operator, deployer]
    lifecycle: [operate, observe]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T2: recommended
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        egress_detector.enabled == true
        AND egress_detector.covers_public_services == true
    evidence:
      - schema: openaisf.evidence.egress_detector.v1
        plane: control
        fields: [enabled, covers_public_services, alert_routing]
      - schema: openaisf.evidence.egress_anomaly.v1
        plane: data
        fields: [novel_destinations, alerts, window]
    failure_mode: >
      The Hugging Face attacker staged command and control on public services
      precisely because reputation-based egress filtering treats them as benign.
      Any detector keyed on destination reputation rather than on prior
      authorisation would have seen nothing.
    rationale: >
      The question that matters is not whether a destination is trustworthy in
      general but whether this execution context was ever supposed to reach it.
      That reframing is what makes the control effective against
      living-off-trusted-services techniques, and it is why the predicate
      requires explicit coverage of public services.
    crosswalk:
      iso_42001: [A.6.2.6, A.6.2.8]
      nist_ai_rmf: [MEASURE-2.7, MANAGE-4.1]
      eu_ai_act: ["Art.15(1)", "Art.72"]
      owasp_llm_2025: [LLM02]
      owasp_llm_2026: [LLM02]
      mitre_atlas: [AML.T0025, AML.T0024]
      csa_aicm: [LOG-05, DSP-10]
      mcp_38: [MCP-24, MCP-32]

  - id: D15-C05
    title: Canary credentials and honeytokens are planted and monitored
    domain: D15
    level: core
    chain_stage: detect
    normative: >
      The deployment MUST place credentials, files or records that no legitimate
      agent has any reason to access, and MUST raise a detection event on any
      access. Canaries MUST be indistinguishable from genuine assets to the
      agent.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [operate, observe]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T2: recommended
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        canaries.deployed > 0
        AND canaries.verified_reachable == true
        AND canary.fired_on_drill == true
    evidence:
      - schema: openaisf.evidence.canary_deployment.v1
        plane: control
        fields: [count, placement, alert_routing]
      - schema: openaisf.evidence.canary_event.v1
        plane: data
        fields: [triggers, drill_triggers, window]
    failure_mode: >
      Credential harvesting from environment variables and configuration files
      is the most commonly documented escalation path in agent deployments, and
      it was the decisive step at Hugging Face. An agent enumerating secrets does
      not know which are real.
    rationale: >
      This is the cheapest high-confidence detector available and the only one in
      this domain with a near-zero false-positive rate: a canary either fired or
      it did not, which makes it binary in evidence and impossible to argue with.
      Requiring verified reachability stops the common failure of planting
      canaries somewhere the agent could never have looked.
    crosswalk:
      iso_42001:
        - {ref: A.6.2.8, strength: partial}
      nist_ai_rmf:
        - {ref: MEASURE-2.7, strength: partial}
      eu_ai_act:
        - {ref: "Art.15(5)", strength: partial}
      mitre_atlas: [AML.T0055, AML.T0084]
      csa_aicm:
        - {ref: LOG-05, strength: partial}
        - {ref: SEF-03, strength: partial}
      mcp_38: [MCP-02]

  - id: D15-C06
    title: Retained traces are sufficient to reconstruct why an agent acted
    domain: D15
    level: core
    chain_stage: detect
    normative: >
      Traces retained for an agent MUST be sufficient to reconstruct, for any
      action within the retention period, the inputs the agent held, the tools
      available to it, the authorisation basis for the action, and the stated
      reasoning that preceded it. Sufficiency MUST be demonstrated by replaying a
      sampled decision, not asserted.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [operate, observe, respond]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T3: P7D
        T4: PT24H
      predicate: |
        retention_period declared
        AND replay_sample.performed == true
        AND replay_sample.reconstructed == true
    evidence:
      - schema: openaisf.evidence.trace_policy.v1
        plane: control
        fields: [retention_period, captured_fields]
      - schema: openaisf.evidence.replay_test.v1
        plane: data
        fields: [sampled_decisions, reconstructed, failures, window]
    failure_mode: >
      The inability to replay an agent decision is one of the three dominant
      agent incident-response risks reported by enterprises. MCP provides no
      built-in audit trail, so attackers pivoting through an agent can leave no
      recoverable log evidence unless a dedicated proxy was already in place.
      The gap is discovered during the incident, when it is unfixable.
    rationale: >
      Every other detector in this domain produces an alert; this one produces
      the ability to answer what actually happened afterwards. Demonstrating
      sufficiency by replay rather than by declaring a retention policy is the
      whole point: retention policies are routinely satisfied by logs that omit
      the one field needed to reconstruct a decision.
    crosswalk:
      iso_42001: [A.6.2.8, A.8.4]
      nist_ai_rmf: [MEASURE-2.8, MANAGE-4.3]
      eu_ai_act: ["Art.12(1)", "Art.12(3)", "Art.19", "Art.26(6)"]
      csa_aicm: [LOG-01, LOG-03, LOG-10]
      mcp_38: [MCP-38]

  - id: D15-C07
    title: Action outside the authorised business purpose is detected
    domain: D15
    level: core
    chain_stage: detect
    normative: >
      Every AI system and agent MUST be bound to an authorised business purpose
      recorded under D01-C03. The deployment MUST detect and raise an event when
      observed activity falls outside that purpose, independently of whether the
      activity was within the capability manifest and consistent with the agent's
      declared plan.
    rfc2119: MUST
    roles: [deployer]
    lifecycle: [operate, observe]
    tiers:
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T3: P7D
        T4: PT24H
      predicate: |
        purpose_binding.present == true
        AND purpose_detector.enabled == true
        AND unpurposed_activity.reviewed == true
    evidence:
      - schema: openaisf.evidence.purpose_binding.v1
        plane: control
        fields: [system_id, authorised_purpose, approved_by]
      - schema: openaisf.evidence.purpose_divergence.v1
        plane: data
        fields: [evaluated, outside_purpose, reviewed, window]
    failure_mode: >
      Ninety-eight percent of organisations have employees using unsanctioned AI
      tools and by 2026 around seventy percent of employee AI interaction happens
      through features embedded in already-sanctioned SaaS, which makes approved
      and unapproved use hard to tell apart. The average shadow-AI breach costs
      4.2 million dollars. In every one of those cases the system was operating
      within its technical permissions and outside any purpose the organisation
      had authorised.
    rationale: >
      This is the third and outermost layer of intent, and it is the one no other
      framework asks for. D15-C01 asks whether the agent did what it said. This
      control asks whether it should have been doing that at all. An agent can
      sit entirely inside its manifest, match its declared plan perfectly, and
      still be performing work the organisation never sanctioned — and only a
      recorded authorised purpose makes that difference visible.
    crosswalk:
      iso_42001:
        - {ref: A.9.4, strength: partial}
      nist_ai_rmf:
        - {ref: MAP-1.1, strength: partial}
      eu_ai_act:
        - {ref: "Art.26(1)", strength: partial}

  - id: D15-X01
    title: Anomalies in the delegation chain are detected
    domain: D15
    level: expansion
    chain_stage: detect
    normative: >
      The deployment MUST raise a detection event when a delegation chain exceeds
      its declared depth, when a child agent holds capability its parent did not,
      or when the originating human principal cannot be resolved for a hop.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [operate, observe]
    applies_when:
      system_class: [agentic]
      autonomy: [">= planning"]
    tiers:
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T4: PT24H
      predicate: |
        chain_detector.enabled == true
        AND unresolved_principal_events.reviewed == true
    evidence:
      - schema: openaisf.evidence.chain_detector.v1
        plane: control
        fields: [enabled, alert_routing]
      - schema: openaisf.evidence.chain_anomaly.v1
        plane: data
        fields: [depth_breaches, escalations, unresolved_principals, window]
    failure_mode: >
      No deployed protocol can cryptographically prove which human principal
      authorised which agent to perform which specific action at the third or
      fourth hop of a delegation chain. An unresolvable principal is therefore
      not an edge case but the expected outcome of an unmonitored chain, and it
      is indistinguishable from an injected hop.
    rationale: >
      D07-C03 bounds the chain; this control notices when the bound is breached.
      The unresolvable-principal signal is the valuable one, because it fires on
      exactly the condition an attacker needs in order to act with authority
      nobody granted.
    crosswalk:
      iso_42001:
        - {ref: A.3.2, strength: partial}
      nist_ai_rmf:
        - {ref: GOVERN-2.1, strength: partial}
      csa_aicm:
        - {ref: IAM-04, strength: partial}
        - {ref: LOG-05, strength: partial}
      mcp_38: [MCP-04]

# OpenAISF catalog — D07 Agentic Authority & Containment
#
# The Bound stage of the rogue-agent control chain. Prompt injection is
# unsolved at the model layer and no control here claims to prevent it. Every
# control in this domain bounds what a landed injection can reach.
#
# OpenAISF — created by Maarten Loose. Specification licensed CC-BY-4.0.
domain: D07
name: Agentic Authority & Containment
controls:
  - id: D07-C01
    title: Agent capability is declared in a signed manifest and enforced default-deny
    domain: D07
    level: core
    chain_stage: bound
    normative: >
      An agent MUST NOT invoke a tool, reach a network destination, assume a
      credential, or read a data source that is not declared in a capability
      manifest cryptographically bound to that agent's identity. The enforcement
      point MUST default to deny and MUST record every denied attempt.
    rfc2119: MUST
    roles: [provider, deployer, operator]
    lifecycle: [build, release, operate]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T1: recommended
      T2: required
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T1: P90D
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        manifest.signature.verified == true
        AND enforcement.default_policy == "deny"
        AND (traffic.requests > 0 IMPLIES enforcement.decisions.total > 0)
    evidence:
      - schema: openaisf.evidence.capability_manifest.v1
        plane: control
        source_hint: [mcp_gateway, litellm, portkey, kong_ai, custom]
      - schema: openaisf.evidence.enforcement_counter.v1
        plane: data
        fields: [allowed, denied, undeclared_attempts, window]
    failure_mode: >
      Hugging Face, July 2026. A malicious dataset achieved code execution on a
      processing worker through a remote code loader and a template injection in
      a dataset configuration. That context then reached node-level access,
      collected cloud and cluster credentials, and moved laterally across
      internal clusters over a weekend. Nothing constrained which credentials and
      hosts the executing context was permitted to touch, so every subsequent hop
      was simply available to it.
    rationale: >
      Declaring capability converts an open-ended execution context into a closed
      set that can be checked. The manifest is also the reference against which
      D15-C02 detects violation: without a declared set there is no such thing as
      an undeclared attempt, and detection has nothing to compare against.
    crosswalk:
      iso_42001: [A.6.2.6, A.9.4]
      nist_ai_rmf: [MANAGE-2.2, MAP-2.2]
      eu_ai_act: ["Art.14(4)(e)", "Art.15(1)"]
      owasp_llm_2025: [LLM06]
      owasp_llm_2026: [LLM03]
      mitre_atlas: [AML.T0053, AML.T0011, AML.T0084.001, AML.T0084.003]
      csa_aicm: [IAM-11, MDS-05]
      mcp_38: [MCP-05, MCP-34, MCP-17]

  - id: D07-C02
    title: Every agent session runs under a declared and enforced action budget
    domain: D07
    level: core
    chain_stage: bound
    normative: >
      Each agent session MUST declare a budget covering, at minimum, tool
      invocations, tokens, monetary spend, write operations and egress volume.
      The enforcement point MUST halt the session on exhaustion and MUST NOT
      permit a session to raise its own budget.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [release, operate]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T2: required
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        budget.declared == true
        AND budget.self_modifiable == false
        AND enforcement.halts_on_exhaustion == true
    evidence:
      - schema: openaisf.evidence.action_budget.v1
        plane: control
        fields: [calls, tokens, spend, write_ops, egress_bytes]
      - schema: openaisf.evidence.budget_enforcement.v1
        plane: data
        fields: [sessions, halted, exhausted, window]
    failure_mode: >
      The Hugging Face intrusion ran many thousands of individual actions across
      a swarm of short-lived sandboxes. Anthropic's GTG-1002 disclosure describes
      an operation discovering and exploiting vulnerabilities at thousands of
      requests per second. Neither rate is reachable by a legitimate workflow,
      and in both cases nothing capped the volume an agent identity could consume
      before a human saw it.
    rationale: >
      A budget converts an unbounded loop into a bounded one. It is the cheapest
      available limit on blast radius and the only one that works when the
      attacker controls the agent's reasoning rather than its code. It also
      supplies the denominator for the velocity signature in D15-C03.
    crosswalk:
      iso_42001:
        - {ref: A.6.2.6, strength: partial}
        - {ref: A.4.5, strength: partial}
      nist_ai_rmf:
        - {ref: MANAGE-2.2, strength: partial}
        - {ref: MEASURE-2.6, strength: partial}
      eu_ai_act:
        - {ref: "Art.15(1)", strength: partial}
      owasp_llm_2025: [LLM10, LLM06]
      owasp_llm_2026: [LLM06, LLM03]
      mitre_atlas: [AML.T0034.002, AML.T0035]
      csa_aicm:
        - {ref: IAM-11, strength: partial}
      mcp_38: [MCP-33]

  - id: D07-C03
    title: Delegation depth is bounded and no agent may spawn a more privileged agent
    domain: D07
    level: core
    chain_stage: bound
    normative: >
      An agent that spawns or delegates to another agent MUST NOT confer
      capability it does not itself hold, and the delegation chain MUST NOT
      exceed a declared maximum depth. Every hop MUST carry the identity of the
      human principal on whose authority the chain began.
    rfc2119: MUST
    roles: [provider, deployer, operator]
    lifecycle: [build, release, operate]
    applies_when:
      system_class: [agentic]
      autonomy: [">= planning"]
    tiers:
      T2: recommended
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        delegation.max_depth declared
        AND delegation.privilege_escalation_observed == 0
        AND delegation.principal_propagated == true
    evidence:
      - schema: openaisf.evidence.delegation_policy.v1
        plane: control
        fields: [max_depth, escalation_permitted]
      - schema: openaisf.evidence.delegation_trace.v1
        plane: data
        fields: [max_observed_depth, escalation_attempts, principal_present]
    failure_mode: >
      No deployed protocol can cryptographically prove which human principal
      authorised which agent to perform which action at the third or fourth hop
      of a delegation chain. Non-human identities already outnumber human users
      by roughly 45 to 1 in enterprises and 144 to 1 in cloud-native estates, so
      an unbounded chain produces authority nobody issued and nobody can trace.
    rationale: >
      Bounding depth keeps the chain short enough to reason about, and forbidding
      escalation makes the chain monotonically non-increasing in privilege. That
      single property is what lets a reviewer answer "could this agent possibly
      have done that" without reconstructing the whole graph.
    crosswalk:
      iso_42001:
        - {ref: A.3.2, strength: partial}
        - {ref: A.9.4, strength: partial}
      nist_ai_rmf:
        - {ref: GOVERN-2.1, strength: partial}
        - {ref: MANAGE-2.2, strength: partial}
      eu_ai_act:
        - {ref: "Art.14(1)", strength: partial}
        - {ref: "Art.26(2)", strength: partial}
      owasp_llm_2025: [LLM06]
      owasp_llm_2026: [LLM03]
      mitre_atlas: [AML.T0053]
      csa_aicm:
        - {ref: IAM-04, strength: partial}
        - {ref: IAM-11, strength: partial}
      mcp_38: [MCP-04, MCP-06]

  - id: D07-C04
    title: Actions carry a reversibility class and irreversible actions are human-gated
    domain: D07
    level: core
    chain_stage: bound
    normative: >
      Every action an agent may take MUST be classified as reversible,
      compensable or irreversible. An irreversible action MUST require explicit
      human approval recorded against a named person before execution. Approval
      MUST NOT be obtainable from the agent itself.
    rfc2119: MUST
    roles: [provider, deployer]
    lifecycle: [build, release, operate]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T2: recommended
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        all_actions_classified == true
        AND irreversible_without_approval == 0
    evidence:
      - schema: openaisf.evidence.reversibility_map.v1
        plane: control
        fields: [action, class]
      - schema: openaisf.evidence.approval_record.v1
        plane: data
        fields: [action, approver, decided_at, unapproved_irreversible]
    failure_mode: >
      Enterprises report an inability to revert an autonomous containment action
      as one of three dominant agent incident-response risks, alongside silent
      behaviour change after a vendor update and the inability to replay an
      agent decision. Approval fatigue compounds it: high-frequency approval
      requests condition operators to approve without reading, so attackers embed
      critical operations among routine ones.
    rationale: >
      Classifying by reversibility puts the human gate exactly where it is worth
      the friction and nowhere else. A blanket approval requirement produces
      approval fatigue, which is itself an attack surface; gating only the
      irreversible keeps the number of decisions small enough that each one is
      still read.
    crosswalk:
      iso_42001:
        - {ref: A.9.2, strength: partial}
        - {ref: A.9.3, strength: partial}
      nist_ai_rmf:
        - {ref: MANAGE-1.1, strength: partial}
        - {ref: MAP-3.5, strength: partial}
      eu_ai_act:
        - {ref: "Art.14(4)(d)", strength: partial}
        - {ref: "Art.14(4)(e)", strength: partial}
        - {ref: "Art.26(2)", strength: partial}
      owasp_llm_2025: [LLM06]
      owasp_llm_2026: [LLM03]
      mitre_atlas: [AML.T0053, AML.T0101]
      csa_aicm:
        - {ref: IAM-11, strength: partial}
        - {ref: GRC-06, strength: partial}
      mcp_38: [MCP-22, MCP-23]

  - id: D07-C05
    title: Agent network egress is allowlisted and denied by default
    domain: D07
    level: core
    chain_stage: bound
    normative: >
      Network destinations reachable by an agent execution context MUST be
      restricted to a declared allowlist. All other egress MUST be denied and
      every denial MUST be recorded with the attempted destination.
    rfc2119: MUST
    roles: [operator, deployer]
    lifecycle: [release, operate]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T2: recommended
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        egress.default_policy == "deny"
        AND egress.allowlist declared
        AND egress.denials recorded
    evidence:
      - schema: openaisf.evidence.egress_policy.v1
        plane: control
        fields: [default_policy, allowlist]
      - schema: openaisf.evidence.egress_denial.v1
        plane: data
        fields: [denied_destinations, denial_count, window]
    failure_mode: >
      The Hugging Face attacker staged self-migrating command and control on
      public services. Egress to a public service is indistinguishable from
      legitimate traffic at the packet level and is only distinguishable at the
      policy level, by whether that destination was ever supposed to be
      reachable from that context.
    rationale: >
      Default-deny egress is the single control that most directly breaks the
      exfiltration and command-and-control stages of every agentic incident on
      record. It also produces the denial stream that D15-C04 needs: without
      recorded denials there is no anomaly to detect.
    crosswalk:
      iso_42001: [A.6.2.6]
      nist_ai_rmf: [MANAGE-2.2, MEASURE-2.7]
      eu_ai_act: ["Art.15(1)", "Art.15(5)"]
      owasp_llm_2025: [LLM02]
      owasp_llm_2026: [LLM02]
      mitre_atlas: [AML.T0025, AML.T0024, AML.T0086, AML.T0085, AML.T0085.001]
      csa_aicm: [IAM-11, DSP-10]
      mcp_38: [MCP-32, MCP-24]

  - id: D07-C06
    title: Agent runs use short-lived credentials scoped to the run
    domain: D07
    level: core
    chain_stage: bound
    normative: >
      An agent run MUST authenticate using a credential issued for that run,
      scoped to the capabilities in its manifest, and expiring no later than the
      end of the run. Long-lived shared secrets MUST NOT be readable by an agent
      execution context.
    rfc2119: MUST
    roles: [operator, deployer]
    lifecycle: [release, operate]
    applies_when:
      system_class: [agentic]
      autonomy: [">= tool_use"]
    tiers:
      T2: recommended
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T2: P30D
        T3: P7D
        T4: PT24H
      predicate: |
        credentials.max_lifetime <= run.max_duration
        AND credentials.long_lived_readable == 0
    evidence:
      - schema: openaisf.evidence.credential_policy.v1
        plane: control
        fields: [max_lifetime, scoping]
      - schema: openaisf.evidence.credential_issuance.v1
        plane: data
        fields: [issued, max_observed_lifetime, long_lived_reads]
    failure_mode: >
      In the Hugging Face intrusion the decisive escalation was collecting cloud
      and cluster credentials from a compromised worker. Environment-variable and
      configuration-file harvesting is the most commonly documented credential
      path in MCP deployments, because agents are routinely granted tools that
      read exactly those locations.
    rationale: >
      A credential that expires with the run converts credential theft from a
      persistent foothold into a time-boxed one, and scoping it to the manifest
      means a stolen credential grants nothing the agent was not already allowed
      to do. This is the control that makes containment in D16 actually work:
      revoking a session is meaningless if the credentials it minted outlive it.
    crosswalk:
      iso_42001: [A.4.5, A.9.4]
      nist_ai_rmf: [MANAGE-2.2]
      eu_ai_act: ["Art.15(1)", "Art.15(5)"]
      owasp_llm_2025: [LLM02]
      owasp_llm_2026: [LLM02]
      mitre_atlas: [AML.T0055, AML.T0084, AML.T0083, AML.T0098, AML.T0112.000]
      csa_aicm: [IAM-08, CEK-03]
      mcp_38: [MCP-02]

  - id: D07-C07
    title: Each agent declares a containment tier with controls attached to it
    domain: D07
    level: core
    chain_stage: bound
    normative: >
      Every agent MUST be assigned a containment tier of sand-run, limited or
      privileged. The controls required at each tier MUST be declared, and an
      agent MUST NOT execute at a tier above the one it is assigned.
    rfc2119: MUST
    roles: [deployer, operator]
    lifecycle: [conceive, release, operate]
    applies_when:
      system_class: [agentic]
    tiers:
      T3: required
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T3: P7D
        T4: PT24H
      predicate: |
        containment_tier assigned
        AND executions_above_assigned_tier == 0
    evidence:
      - schema: openaisf.evidence.containment_tier.v1
        plane: control
        fields: [agent, tier, required_controls]
      - schema: openaisf.evidence.containment_enforcement.v1
        plane: data
        fields: [executions, tier_violations, window]
    failure_mode: >
      Gartner expects 40% of enterprises to demote or decommission autonomous
      agents by 2027 because governance gaps are found only after an incident.
      A common root cause is that a prototype agent built for a sandbox is
      promoted into production authority without anyone restating what it is now
      permitted to touch.
    rationale: >
      A containment tier makes the promotion decision explicit and reviewable.
      It also gives the SoA a scoping variable: a sand-run agent legitimately
      escapes most of this domain, which is what stops the catalog becoming
      bureaucracy for teams doing genuinely low-risk work.
    crosswalk:
      iso_42001:
        - {ref: A.6.2.5, strength: partial}
        - {ref: A.9.2, strength: partial}
      nist_ai_rmf:
        - {ref: MANAGE-1.1, strength: partial}
        - {ref: GOVERN-1.3, strength: partial}
      eu_ai_act:
        - {ref: "Art.9(2)(d)", strength: partial}
        - {ref: "Art.26(1)", strength: partial}
      owasp_llm_2025: [LLM06]
      owasp_llm_2026: [LLM03]
      mitre_atlas: [AML.T0053]
      csa_aicm:
        - {ref: GRC-03, strength: partial}
        - {ref: IAM-11, strength: partial}
      mcp_38: [MCP-05, MCP-37]

  - id: D07-X01
    title: Multi-agent interactions are bounded against collusion and cascade
    domain: D07
    level: expansion
    chain_stage: bound
    normative: >
      Where agents interact with other agents, the deployment MUST declare which
      agents may communicate, MUST verify the identity of any counterparty agent
      before accepting instructions from it, and MUST bound the propagation of a
      single agent's failure across the population.
    rfc2119: MUST
    roles: [provider, deployer, operator]
    lifecycle: [build, release, operate]
    applies_when:
      system_class: [agentic]
      autonomy: [">= multi_agent"]
    tiers:
      T3: recommended
      T4: required
    verification:
      method: emitted
      planes: [control, data]
      freshness:
        T3: P7D
        T4: PT24H
      predicate: |
        interaction_graph declared
        AND counterparty_identity_verified == true
        AND cascade_bound declared
    evidence:
      - schema: openaisf.evidence.interaction_policy.v1
        plane: control
        fields: [permitted_pairs, identity_scheme, cascade_bound]
      - schema: openaisf.evidence.interaction_trace.v1
        plane: data
        fields: [unverified_counterparties, cascade_events, window]
    failure_mode: >
      Multi-agent risks arise from interaction rather than from any single agent:
      collusion to circumvent constraints, cascading failure where one agent's
      error propagates, and leakage across contexts that should stay isolated.
      A2A advertises capability through agent cards but does not mandate how
      those cards are verified, so impersonation, card tampering and replay are
      live risks without additional controls.
    rationale: >
      Single-agent evaluation cannot surface interaction risk by construction.
      Declaring the interaction graph turns an emergent property into a checkable
      one, and verifying counterparties is what stops a compromised agent
      injecting into a shared context that downstream agents then reason over.
    crosswalk:
      iso_42001:
        - {ref: A.6.2.6, strength: partial}
        - {ref: A.10.2, strength: partial}
      nist_ai_rmf:
        - {ref: MAP-4.1, strength: partial}
        - {ref: MEASURE-3.1, strength: partial}
      eu_ai_act:
        - {ref: "Art.15(1)", strength: partial}
        - {ref: Art.25, strength: partial}
      owasp_llm_2025: [LLM06]
      owasp_llm_2026: [LLM03]
      mitre_atlas: [AML.T0080, AML.T0082, AML.T0103, AML.T0108]
      csa_aicm:
        - {ref: IAM-11, strength: partial}
        - {ref: STA-05, strength: partial}
      mcp_38: [MCP-36, MCP-14, MCP-01]
